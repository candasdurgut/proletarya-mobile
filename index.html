<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proletarya Mobil</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #1a1a1a;
    color: #f2d16b;
    padding: 15px;
    padding-bottom: 30px;
    min-height: 100vh;
  }

  input, button {
    width: 100%; 
    padding: 16px;
    border-radius: 12px;
    border: none;
    margin: 8px 0;
    background: rgba(70,70,70,0.85);
    color: #f2d16b;
    font-size: 16px;
  }

  button { 
    background: rgba(242,209,107,0.9);
    color: #1a1a1a;
    font-weight: bold;
    font-size: 18px;
    margin-top: 12px;
  }

  button:active {
    transform: scale(0.98);
  }

  .results {
    background: rgba(40,40,40,0.9);
    padding: 18px;
    border-radius: 15px;
    margin-top: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
  }

  .header h1 { 
    margin:0; 
    font-size:24px;
  }

  .header .slogan {
    font-size: 14px;
    margin-top: 5px;
    opacity: 0.9;
  }

  .live-panel {
    background: rgba(60,60,60,0.6);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-top: 15px;
  }

  .day {
    padding: 8px 2px;
    border-radius: 6px;
    text-align: center;
    min-height: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 12px;
  }

  .day small {
    font-size: 10px;
    margin-top: 2px;
    opacity: 0.9;
  }

  .past { background: #4caf50; color:white; }
  .today { background: #f2d16b; color:black; }
  .future { background: #d9534f; color:white; }
  .holiday { background: #ff80b9; color:black; }

  .bar-container {
    background: rgba(70,70,70,0.7);
    width:100%; 
    height:25px;
    border-radius:15px;
    margin-top:15px;
    position: relative;
  }

  .bar {
    height:100%; 
    width:0%;
    background:#f2d16b; 
    border-radius:15px;
    transition: width 0.2s linear;
    position: relative;
  }

  .bar-text {
    position: absolute;
    width:100%;
    text-align:center;
    top:0; 
    left:0;
    line-height:25px;
    font-weight:bold;
    color:black;
    pointer-events:none;
  }

  .footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
  }

  .rain-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  .rain-item {
    position: absolute;
    font-size: 24px;
    animation: rain-fall linear forwards;
  }

  @keyframes rain-fall {
    0% {
      transform: translateY(-50px) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="rain-container" id="rainContainer"></div>

<div class="header">
    <h1>✊ Proletarya Mobil ✊</h1>
    <div class="slogan" id="dailySlogan">Emekçinin birliği sermayeyi yenecek!</div>
</div>

<div id="livePanel"></div>

<div class="results" id="results"></div>

<div id="formSection">
    <h3>⚙️ Ayarlar</h3>
    <label>Maaş:</label>
    <input id="salary" type="number" placeholder="15000" value="15000">

    <label>Maaş Günü (1-31):</label>
    <input id="payday" type="number" placeholder="15" min="1" max="31" value="15">

    <label>Mesai Başlangıç:</label>
    <input id="start" type="time" value="09:00">

    <label>Mesai Bitiş:</label>
    <input id="end" type="time" value="18:00">

    <button onclick="calc()">📊 Raporu Oluştur</button>
</div>

<div class="footer" onclick="startMoneyRain()" style="cursor: pointer;">
    <div>v1.0 - Proletarya Kalkınma</div>
</div>

<script>
// BASIT LOCALSTORAGE
function saveSettings(settings) {
    localStorage.setItem('proletarya_settings', JSON.stringify(settings));
}

function loadSettings() {
    const saved = localStorage.getItem('proletarya_settings');
    return saved ? JSON.parse(saved) : null;
}

// PARA YAGMURU
function startMoneyRain() {
    const rainContainer = document.getElementById('rainContainer');
    const items = ['💰', '💵', '💎', '🪙', '⚒️', '☭'];
    
    rainContainer.innerHTML = '';
    
    for (let i = 0; i < 30; i++) {
        setTimeout(() => {
            const item = document.createElement('div');
            item.className = 'rain-item';
            item.textContent = items[Math.floor(Math.random() * items.length)];
            
            const left = Math.random() * 100;
            const duration = 2 + Math.random() * 2;
            const fontSize = 20 + Math.random() * 20;
            
            item.style.left = left + '%';
            item.style.animationDuration = duration + 's';
            item.style.fontSize = fontSize + 'px';
            
            const colors = ['#f2d16b', '#ffd700', '#c0c0c0', '#ff6b6b'];
            item.style.color = colors[Math.floor(Math.random() * colors.length)];
            
            rainContainer.appendChild(item);
            
            setTimeout(() => {
                if (item.parentNode) {
                    item.parentNode.removeChild(item);
                }
            }, duration * 1000);
            
        }, i * 100);
    }
}

// SLOGANLAR
const slogans = [
    "✊ Emekçinin birliği sermayeyi yenecek!",
    "⚡ Sömürüye son, hakkını al!",
    "🔨 Gücümüz birliğimizde!",
    "⚖️ Kazanç adaletle büyür!",
    "💪 Günlük emeğin kutsaldır!"
];

function randomSlogan() {
    const s = slogans[Math.floor(Math.random() * slogans.length)];
    document.getElementById("dailySlogan").innerText = s;
}

// ANA HESAPLAMA
let dailyWage = 0;
let workDuration = 0;
let timerInterval = null;
let daysWorkedSoFar = 0;  
let totalWorkdaysThisMonth = 0;

function calc() {
    clearInterval(timerInterval);

    const salary = Number(document.getElementById('salary').value);
    const payday = Number(document.getElementById('payday').value);

    if (!salary || !payday) {
        alert("Lütfen maaş ve maaş gününü girin");
        return;
    }

    const startTime = document.getElementById("start").value;
    const endTime = document.getElementById("end").value;

    // Ayarları kaydet
    saveSettings({ salary, payday, startTime, endTime });

    const now = new Date();
    const [sh, sm] = startTime.split(":").map(Number);
    const [eh, em] = endTime.split(":").map(Number);

    const workStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sh, sm, 0);
    const workEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eh, em, 0);
    workDuration = (workEnd - workStart) / 1000;

    const year = now.getFullYear();
    const month = now.getMonth();

    let paydayDate = new Date(year, month, payday);
    if (paydayDate < now) paydayDate = new Date(year, month + 1, payday);

    const totalDaysRemaining = Math.ceil((paydayDate - now) / (1000 * 3600 * 24));

    const start = new Date(year, month, 1);
    const end = new Date(year, month + 1, 0);

    totalWorkdaysThisMonth = 0;
    daysWorkedSoFar = 0;

    for (let d = 1; d <= end.getDate(); d++) {
        const date = new Date(year, month, d);
        const isWeekend = (date.getDay() === 0 || date.getDay() === 6);
        if (!isWeekend) {
            totalWorkdaysThisMonth++;
            if (date < now) daysWorkedSoFar++;
        }
    }

    dailyWage = salary / totalWorkdaysThisMonth;
    let monthlyEarnedBase = daysWorkedSoFar * dailyWage;

    let wdRemaining = 0;
    let tmp = new Date(now);
    while (tmp <= paydayDate) {
        let g = tmp.getDay();
        if (g !== 0 && g !== 6) wdRemaining++;
        tmp.setDate(tmp.getDate() + 1);
    }

    // CANLI PANEL
    document.getElementById("livePanel").innerHTML = `
    <div class="live-panel">
        <h2>⏱ Canlı Mesai Takibi</h2>
        <div class="bar-container"><div id="workBar" class="bar"><div class="bar-text" id="workBarText">0%</div></div></div>
        <p id="progressText"></p>
        <h3>💸 Anlık Kazanç</h3>
        <p>Bugün: <b id="earnedToday">0₺</b></p>
        <p>Bu Ay: <b id="earnedMonth">0₺</b></p>
        <h3>📊 Ücret Oranları</h3>
        <p>Saatlik: <b id="h">0₺</b></p>
        <p>Dakikalık: <b id="m">0₺</b></p>
        <p>Saniyelik: <b id="s">0₺</b></p>
        <h3>📈 Aylık İlerleme</h3>
        <div class="bar-container"><div id="monthBar" class="bar"><div class="bar-text" id="monthBarText">0%</div></div></div>
    </div>
    `;

    // TAKVIM
    let calHtml = `<div class="calendar">`;
    for (let d = 1; d <= end.getDate(); d++) {
        const date = new Date(year, month, d);
        const isWeekend = (date.getDay() === 0 || date.getDay() === 6);

        let cls = "";
        if (isWeekend) cls = "holiday";
        else if (d === now.getDate()) cls = "today";
        else if (date < now) cls = "past";
        else cls = "future";

        calHtml += `<div class="day ${cls}">`;
        calHtml += `<div>${d}</div>`;
        if (!isWeekend) {
            calHtml += `<small>${dailyWage.toFixed(0)}₺</small>`;
        }
        calHtml += `</div>`;
    }
    calHtml += `</div>`;

    document.getElementById("results").innerHTML = `
        <h3>📢 Genel Rapor</h3>
        <p>Maaşa kalan gün: <b>${totalDaysRemaining}</b></p>
        <p>Maaşa kalan iş günü: <b>${wdRemaining}</b></p>
        <p>Günlük hakediş: <b>${dailyWage.toFixed(2)}₺</b></p>
        <p>Bu ay çalışılan gün: <b>${daysWorkedSoFar}/${totalWorkdaysThisMonth}</b></p>
        <h3>📆 İş Takvimi</h3>
        ${calHtml}
    `;

    startLiveCounter(monthlyEarnedBase);
}

function startLiveCounter(monthlyEarnedBase) {
    const hourly = dailyWage / (workDuration / 3600);
    const minutely = hourly / 60;
    const secondly = minutely / 60;

    document.getElementById("h").innerText = hourly.toFixed(2) + "₺";
    document.getElementById("m").innerText = minutely.toFixed(4) + "₺";
    document.getElementById("s").innerText = secondly.toFixed(6) + "₺";

    timerInterval = setInterval(() => {
        const now = new Date();
        const startTime = document.getElementById("start").value;
        const endTime = document.getElementById("end").value;
        
        const [sh, sm] = startTime.split(":").map(Number);
        const [eh, em] = endTime.split(":").map(Number);

        const workStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sh, sm, 0);
        const workEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eh, em, 0);

        let earnedToday = 0;
        let progress = 0;

        if (now >= workStart && now <= workEnd) {
            const passed = (now - workStart) / 1000;
            earnedToday = passed * secondly;
            progress = (passed / workDuration) * 100;
        }
        else if (now > workEnd) {
            earnedToday = dailyWage;
            progress = 100;
        }

        document.getElementById("earnedToday").innerText = earnedToday.toFixed(2) + "₺";
        const monthlyTotal = monthlyEarnedBase + earnedToday;
        document.getElementById("earnedMonth").innerText = monthlyTotal.toFixed(2) + "₺";

        document.getElementById("workBar").style.width = progress.toFixed(2) + "%";
        document.getElementById("workBarText").innerText = progress.toFixed(1) + "%";

        const monthProgress = ((daysWorkedSoFar + (earnedToday / dailyWage)) / totalWorkdaysThisMonth) * 100;
        document.getElementById("monthBar").style.width = monthProgress.toFixed(2) + "%";
        document.getElementById("monthBarText").innerText = monthProgress.toFixed(1) + "%";

        if (now < workStart)
            document.getElementById("progressText").innerText = "Mesai henüz başlamadı.";
        else if (now > workEnd)
            document.getElementById("progressText").innerText = "Mesai tamamlandı.";
        else
            document.getElementById("progressText").innerText = "Günlük mesai: %" + progress.toFixed(2);

    }, 1000);
}

// SAYFA YUKLENINCE
window.addEventListener('load', function() {
    const savedSettings = loadSettings();
    
    if (savedSettings) {
        document.getElementById('salary').value = savedSettings.salary;
        document.getElementById('payday').value = savedSettings.payday;
        document.getElementById('start').value = savedSettings.startTime;
        document.getElementById('end').value = savedSettings.endTime;
        
        setTimeout(() => {
            calc();
        }, 500);
    }

    randomSlogan();
    setInterval(randomSlogan, 30000);
});

// ENTER ILE HESAPLA
document.querySelectorAll('input').forEach(input => {
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            calc();
        }
    });
});
</script>
</body>
</html>
