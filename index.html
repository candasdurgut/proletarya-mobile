<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2d16b">
<title>Proletarya Mobil</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #1a1a1a;
    color: #f2d16b;
    padding: 15px;
    padding-bottom: 30px;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
  }

  /* TÜM INPUTLAR EŞİT BOYUTTA VE ESNEK */
  input, button {
    width: 100%; 
    padding: 16px;
    border-radius: 12px;
    border: none;
    margin: 8px 0;
    background: rgba(70,70,70,0.85);
    color: #f2d16b;
    font-size: 16px;
    -webkit-appearance: none;
  }

  input[type="time"] {
    height: auto;
    min-height: 54px;
  }

  button { 
    background: rgba(242,209,107,0.9);
    color: #1a1a1a;
    font-weight: bold;
    font-size: 18px;
    margin-top: 12px;
  }

  button:active {
    transform: scale(0.98);
    background: rgba(242,209,107,1);
  }

  .results {
    background: rgba(40,40,40,0.9);
    padding: 18px;
    border-radius: 15px;
    margin-top: 20px;
  }

  /* BİRLEŞİK HEADER VE BİLDİRİM ALANI */
  .header-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(30,30,30,0.95);
    backdrop-filter: blur(15px);
    z-index: 1000;
    border-bottom: 1px solid #f2d16b;
    transition: all 0.3s ease;
  }

  .top-panel {
    padding: 10px 15px 4px 15px;
    position: relative;
  }

  .header-center {
    text-align: center;
    width: 100%;
  }

  .top-panel h1 { 
    font-weight:bold; 
    margin:0; 
    font-size:18px;
    text-align: center;
  }

  .top-panel .slogan {
    font-size: 11px;
    color: #f2d16b;
    margin-top: 2px;
    font-weight: normal;
    text-align: center;
    line-height: 1.2;
  }

  #currentDate {
    position: absolute;
    top: 12px;
    right: 15px;
    font-size: 10px;
    opacity: 0.8;
    white-space: nowrap;
  }

  /* BİLDİRİM ALANI */
  .notification-panel {
    background: rgba(242,209,107,0.08);
    border-top: 1px solid #f2d16b30;
    padding: 3px 15px;
    min-height: 45px;
    max-height: 45px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .notification-content {
    flex: 1;
    min-width: 0;
  }

  .notification-text {
    margin: 0;
    font-size: 13px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* TEMİZLE BUTONU */
  .notification-clear {
    background: rgba(242,209,107,0.2);
    border: none;
    color: #f2d16b;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
    flex-shrink: 0;
    width: auto;
    min-width: 30px;
    height: 20px;
    line-height: 14px;
    align-self: center;
  }

  .notification-clear:active {
    background: rgba(242,209,107,0.3);
    transform: scale(0.95);
  }

  /* ANA İÇERİK ALANI */
  .main-content {
    margin-top: 115px;
  }

  /* FORM ALANI */
  .form-section {
    transition: all 0.3s ease;
  }

  .form-section.collapsed {
    margin-top: 25px;
    opacity: 0.9;
    background: rgba(40,40,40,0.7);
    padding: 15px;
    border-radius: 12px;
  }

  .form-section.collapsed h3 {
    font-size: 16px;
    margin-bottom: 12px;
    color: #f2d16b;
    text-align: center;
  }

  /* CANLI PANEL */
  .live-panel {
    background: rgba(60,60,60,0.6);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
  }

  /* MOBİL TAKVİM DÜZENİ */
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-top: 15px;
    font-size: 12px;
  }

  .day {
    padding: 6px 2px;
    border-radius: 6px;
    text-align: center;
    min-height: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 11px;
    line-height: 1.2;
  }

  .day small {
    font-size: 9px;
    margin-top: 2px;
    opacity: 0.9;
  }

  .past { background: #4caf50; color:white; }
  .today { background: #f2d16b; color:black; }
  .future { background: #d9534f; color:white; }
  .holiday { background: #ff80b9; color:black; }

  .bar-container {
    background: rgba(70,70,70,0.7);
    width:100%; 
    height:25px;
    border-radius:15px;
    margin-top:15px;
    position: relative;
  }

  .bar {
    height:100%; 
    width:0%;
    background:#f2d16b; 
    border-radius:15px;
    transition: width 0.2s linear;
    position: relative;
  }

  .bar-text {
    position: absolute;
    width:100%;
    text-align:center;
    top:0; 
    left:0;
    line-height:25px;
    font-weight:bold;
    color:black;
    pointer-events:none;
    font-size: 14px;
  }

  .mobile-footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
  }

  /* KÜÇÜK EKRANLAR İÇİN */
  @media (max-width: 380px) {
    .calendar {
      gap: 3px;
    }
    
    .day {
      padding: 4px 1px;
      min-height: 35px;
      font-size: 10px;
    }
    
    .day small {
      font-size: 8px;
    }

    .main-content {
      margin-top: 105px;
    }

    .top-panel .slogan {
      font-size: 10px;
    }

    #currentDate {
      font-size: 9px;
      top: 10px;
    }

    .notification-panel {
      padding: 2px 12px;
      min-height: 38px;
      max-height: 38px;
    }

    .notification-text {
      font-size: 12px;
    }

    .notification-clear {
      padding: 2px 4px;
      font-size: 9px;
      min-width: 25px;
      height: 16px;
    }
  }

  @media (max-width: 320px) {
    .calendar {
      gap: 2px;
    }
    
    .day {
      padding: 3px 1px;
      min-height: 32px;
      font-size: 9px;
    }
    
    .day small {
      font-size: 7px;
    }

    .top-panel .slogan {
      font-size: 9px;
    }

    #currentDate {
      font-size: 8px;
    }

    .notification-text {
      font-size: 11px;
    }
  }
</style>
</head>
<body>

<!-- BİRLEŞİK HEADER VE BİLDİRİM ALANI -->
<div class="header-container">
    <div class="top-panel">
        <div class="header-center">
            <h1>✊ Proletarya Mobil ✊</h1>
            <div class="slogan" id="dailySlogan"></div>
        </div>
        <div id="currentDate"></div>
    </div>
    
    <div class="notification-panel" id="notificationArea">
        <div class="notification-content">
            <p class="notification-text" id="notificationText">Uygulama açıkken bildirimler burada görünecek</p>
        </div>
        <button class="notification-clear" onclick="clearNotification()">X</button>
    </div>
</div>

<div class="main-content" id="mainContent">
    <!-- CANLI PANEL - RAPOR SONRASI ÜSTTE -->
    <div id="livePanel"></div>

    <!-- SONUÇLAR -->
    <div class="results" id="results"></div>

    <!-- FORM ALANI - RAPOR SONRASI TAKVİM ALTINDA -->
    <div class="form-section" id="formSection">
        <h3>⚙️ Ayarlar</h3>
        <label>Maaş:</label>
        <input id="salary" type="number" placeholder="15000" inputmode="numeric"/>

        <label>Maaş Günü (1–31):</label>
        <input id="payday" type="number" placeholder="15" min="1" max="31" inputmode="numeric"/>

        <label>Mesai Başlangıç Saati:</label>
        <input id="start" type="time" value="09:00"/>

        <label>Mesai Bitiş Saati:</label>
        <input id="end" type="time" value="18:00"/>

        <button onclick="calc()">📊 Raporu Oluştur</button>
    </div>

    <div class="mobile-footer">
        <div>v1.0 - Enhanced Analytics</div>
        <div style="margin-top: 5px;">Ana ekrene ekle → Uygulama gibi kullan</div>
    </div>
</div>

<script>
// 📊 GELİŞMİŞ ANALYTICS TRACKING SİSTEMİ
class ProletaryaAnalytics {
    static API_URL = 'https://proletarya-mobile-analytics.onrender.com';
    static sessionId = null;
    static sessionStartTime = null;
    static pageViewStart = null;

    static async init() {
        this.sessionId = this.generateSessionId();
        this.sessionStartTime = Date.now();
        this.pageViewStart = Date.now();
        
        // Session başlangıcını track et
        await this.trackSessionStart();
        
        // Performance monitoring başlat
        this.initPerformanceTracking();
        
        // User behavior tracking başlat
        this.initBehaviorTracking();
        
        // Device info topla
        this.collectDeviceInfo();
    }

    static generateSessionId() {
        return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    static async trackSessionStart() {
        const deviceInfo = this.getDeviceInfo();
        const locationInfo = await this.getLocationInfo();
        
        await this.track('session_start', {
            session_id: this.sessionId,
            device_info: deviceInfo,
            location_info: locationInfo,
            referrer: document.referrer,
            url: window.location.href
        });
    }

    static async trackSessionEnd() {
        const sessionDuration = Date.now() - this.sessionStartTime;
        
        await this.track('session_end', {
            session_id: this.sessionId,
            duration: sessionDuration,
            page_views: this.getPageViewCount(),
            events_count: this.getEventCount()
        });
    }

    static getDeviceInfo() {
        const ua = navigator.userAgent;
        const connection = navigator.connection || {};
        const battery = navigator.battery || navigator.webkitBattery || navigator.mozBattery;
        
        return {
            user_agent: ua,
            platform: navigator.platform,
            language: navigator.language,
            languages: navigator.languages,
            cookie_enabled: navigator.cookieEnabled,
            screen_resolution: `${screen.width}x${screen.height}`,
            viewport_size: `${window.innerWidth}x${window.innerHeight}`,
            color_depth: screen.colorDepth,
            pixel_ratio: window.devicePixelRatio,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            online: navigator.onLine,
            connection_type: connection.effectiveType,
            connection_speed: connection.downlink,
            memory: navigator.deviceMemory,
            cores: navigator.hardwareConcurrency,
            touch_support: 'ontouchstart' in window,
            battery_level: battery ? battery.level : null,
            battery_charging: battery ? battery.charging : null,
            max_touch_points: navigator.maxTouchPoints || 0
        };
    }

    static async getLocationInfo() {
        try {
            // IP-based location (basit versiyon - gerçek implementasyon için IP API servisi gerekli)
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            
            return {
                ip: data.ip,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                locale: navigator.language,
                coordinates: await this.getGeolocation()
            };
        } catch (error) {
            return {
                ip: 'unknown',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                locale: navigator.language,
                error: error.message
            };
        }
    }

    static async getGeolocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    resolve({
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    });
                },
                (error) => {
                    resolve({ error: error.message });
                },
                { timeout: 5000, enableHighAccuracy: false }
            );
        });
    }

    static initPerformanceTracking() {
        // Core Web Vitals tracking
        if ('PerformanceObserver' in window) {
            // Largest Contentful Paint
            const lcpObserver = new PerformanceObserver((entryList) => {
                const entries = entryList.getEntries();
                const lastEntry = entries[entries.length - 1];
                this.track('performance_metric', {
                    metric: 'LCP',
                    value: lastEntry.renderTime || lastEntry.loadTime,
                    session_id: this.sessionId
                });
            });
            lcpObserver.observe({ entryTypes: ['largest-contentful-paint'] });

            // First Input Delay
            const fidObserver = new PerformanceObserver((entryList) => {
                const entries = entryList.getEntries();
                entries.forEach(entry => {
                    this.track('performance_metric', {
                        metric: 'FID',
                        value: entry.processingStart - entry.startTime,
                        session_id: this.sessionId
                    });
                });
            });
            fidObserver.observe({ entryTypes: ['first-input'] });

            // Cumulative Layout Shift
            let clsValue = 0;
            const clsObserver = new PerformanceObserver((entryList) => {
                const entries = entryList.getEntries();
                entries.forEach(entry => {
                    if (!entry.hadRecentInput) {
                        clsValue += entry.value;
                        this.track('performance_metric', {
                            metric: 'CLS',
                            value: clsValue,
                            session_id: this.sessionId
                        });
                    }
                });
            });
            clsObserver.observe({ entryTypes: ['layout-shift'] });
        }

        // Memory usage tracking
        if ('memory' in performance) {
            setInterval(() => {
                this.track('performance_metric', {
                    metric: 'memory_usage',
                    value: performance.memory.usedJSHeapSize,
                    session_id: this.sessionId
                });
            }, 30000);
        }
    }

    static initBehaviorTracking() {
        // Click tracking
        document.addEventListener('click', (e) => {
            this.track('user_interaction', {
                type: 'click',
                element: e.target.tagName,
                id: e.target.id,
                class: e.target.className,
                x: e.clientX,
                y: e.clientY,
                session_id: this.sessionId
            });
        });

        // Scroll tracking
        let scrollDepth = 0;
        window.addEventListener('scroll', () => {
            const newDepth = Math.round((window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100);
            if (newDepth > scrollDepth) {
                scrollDepth = newDepth;
                this.track('user_interaction', {
                    type: 'scroll',
                    depth: scrollDepth,
                    session_id: this.sessionId
                });
            }
        });

        // Form interaction tracking
        document.querySelectorAll('input, select, textarea').forEach(element => {
            element.addEventListener('focus', () => {
                this.track('user_interaction', {
                    type: 'form_focus',
                    element: element.tagName,
                    id: element.id,
                    session_id: this.sessionId
                });
            });

            element.addEventListener('blur', () => {
                this.track('user_interaction', {
                    type: 'form_blur',
                    element: element.tagName,
                    id: element.id,
                    value_length: element.value.length,
                    session_id: this.sessionId
                });
            });
        });

        // Visibility change tracking
        document.addEventListener('visibilitychange', () => {
            this.track('user_interaction', {
                type: 'visibility_change',
                state: document.visibilityState,
                session_id: this.sessionId
            });
        });

        // Page unload tracking
        window.addEventListener('beforeunload', () => {
            const viewTime = Date.now() - this.pageViewStart;
            this.track('page_view', {
                session_id: this.sessionId,
                view_duration: Math.round(viewTime / 1000),
                scroll_depth: scrollDepth
            });
        });
    }

    static collectDeviceInfo() {
        // Detaylı device fingerprint
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillText('Proletarya Analytics', 2, 2);
        const canvasFingerprint = canvas.toDataURL();

        this.track('device_info', {
            session_id: this.sessionId,
            canvas_fingerprint: canvasFingerprint,
            device_info: this.getDeviceInfo()
        });
    }

    static getPageViewCount() {
        return parseInt(localStorage.getItem('proletarya_page_views') || '0');
    }

    static getEventCount() {
        return parseInt(localStorage.getItem('proletarya_event_count') || '0');
    }

    static async track(event, data = {}) {
        try {
            // Event counter güncelle
            const eventCount = this.getEventCount() + 1;
            localStorage.setItem('proletarya_event_count', eventCount.toString());

            const enhancedData = {
                ...data,
                session_id: this.sessionId,
                timestamp: new Date().toISOString(),
                page_url: window.location.href,
                event_count: eventCount
            };

            const response = await fetch(`${this.API_URL}/track`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    event: event,
                    data: enhancedData
                })
            });

            if (!response.ok) throw new Error('Tracking failed');
            return await response.json();
        } catch (error) {
            console.log('Analytics tracking error:', error);
            // Fallback: localStorage'a kaydet
            this.saveToLocalStorage(event, data);
        }
    }

    static saveToLocalStorage(event, data) {
        try {
            const pendingEvents = JSON.parse(localStorage.getItem('proletarya_pending_events') || '[]');
            pendingEvents.push({
                event: event,
                data: data,
                timestamp: new Date().toISOString()
            });
            localStorage.setItem('proletarya_pending_events', JSON.stringify(pendingEvents));
        } catch (error) {
            console.error('LocalStorage save error:', error);
        }
    }

    static async retryPendingEvents() {
        try {
            const pendingEvents = JSON.parse(localStorage.getItem('proletarya_pending_events') || '[]');
            if (pendingEvents.length === 0) return;

            for (const event of pendingEvents) {
                await this.track(event.event, event.data);
            }

            localStorage.removeItem('proletarya_pending_events');
        } catch (error) {
            console.error('Retry pending events error:', error);
        }
    }
}

// 📦 GELİŞMİŞ LOCALSTORAGE SERVICE
class StorageService {
  static STORAGE_KEY = 'proletarya_app_data';
  
  static defaultData = {
    version: '2.0',
    userSettings: {
      salary: 15000,
      payday: 15,
      startTime: '09:00',
      endTime: '18:00'
    },
    workHistory: [],
    notifications: [],
    userSessions: [],
    lastSync: null
  };

  static getAllData() {
    try {
      const stored = localStorage.getItem(this.STORAGE_KEY);
      if (stored) {
        return JSON.parse(stored);
      }
      this.saveAllData(this.defaultData);
      return this.defaultData;
    } catch (error) {
      console.error('Veri okuma hatası:', error);
      return this.defaultData;
    }
  }

  static saveAllData(data) {
    try {
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (error) {
      console.error('Veri kaydetme hatası:', error);
      return false;
    }
  }

  static updateItem(keyPath, value) {
    const allData = this.getAllData();
    const keys = keyPath.split('.');
    let current = allData;
    
    for (let i = 0; i < keys.length - 1; i++) {
      if (!current[keys[i]]) current[keys[i]] = {};
      current = current[keys[i]];
    }
    
    current[keys[keys.length - 1]] = value;
    return this.saveAllData(allData);
  }

  static getItem(keyPath) {
    const allData = this.getAllData();
    const keys = keyPath.split('.');
    let current = allData;
    
    for (const key of keys) {
      if (current[key] === undefined) return null;
      current = current[key];
    }
    
    return current;
  }

  static addWorkHistory(entry) {
    const allData = this.getAllData();
    
    if (!allData.workHistory) {
      allData.workHistory = [];
    }
    
    allData.workHistory.unshift({
      id: Date.now(),
      date: new Date().toISOString(),
      ...entry
    });
    
    if (allData.workHistory.length > 100) {
      allData.workHistory = allData.workHistory.slice(0, 100);
    }
    
    return this.saveAllData(allData);
  }

  static addNotification(notification) {
    const allData = this.getAllData();
    
    if (!allData.notifications) {
      allData.notifications = [];
    }
    
    allData.notifications.unshift({
      id: Date.now(),
      timestamp: new Date().toISOString(),
      ...notification
    });
    
    if (allData.notifications.length > 200) {
      allData.notifications = allData.notifications.slice(0, 200);
    }
    
    return this.saveAllData(allData);
  }

  static addUserSession(sessionData) {
    const allData = this.getAllData();
    
    if (!allData.userSessions) {
      allData.userSessions = [];
    }
    
    allData.userSessions.unshift({
      id: ProletaryaAnalytics.sessionId,
      start_time: new Date().toISOString(),
      ...sessionData
    });
    
    if (allData.userSessions.length > 50) {
      allData.userSessions = allData.userSessions.slice(0, 50);
    }
    
    return this.saveAllData(allData);
  }
}

// 📢 BİLDİRİM SİSTEMİ
let notificationHistory = [];
let currentNotification = null;
let notificationState = {
    workStartShown: false,
    workEndShown: false,
    progress25: false,
    progress50: false,
    progress75: false,
    money100: false,
    money250: false,
    money500: false,
    hourlyShown: {},
    countdownShown: {}
};

function showNotification(message, type = 'info') {
    const notificationText = document.getElementById('notificationText');
    const notificationArea = document.getElementById('notificationArea');
    
    currentNotification = {
        message: message,
        type: type,
        timestamp: new Date()
    };
    
    // BİLDİRİMİ STORAGE'A KAYDET
    StorageService.addNotification({
        message: message,
        type: type
    });

    // 📊 ANALYTICS: Bildirim gösterildiğini kaydet
    ProletaryaAnalytics.track('notification_shown', {
        message: message,
        type: type,
        length: message.length
    });
    
    notificationHistory.push(currentNotification);
    
    notificationText.textContent = message;
    notificationArea.style.background = 'rgba(242,209,107,0.15)';
    notificationArea.style.borderTop = '1px solid #f2d16b';
    
    console.log('📢 Bildirim:', message);
}

// ⏰ ORJİNAL KOD
let dailyWage = 0;
let workStart = null;
let workEnd = null;
let workDuration = 0;
let timerInterval = null;
let daysWorkedSoFar = 0;  
let totalWorkdaysThisMonth = 0;

function updateClock(){
    const now = new Date();
    const days = ["Pazar","Pzt","Salı","Çar","Per","Cuma","Cmt"];
    const months = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
    const formatted = `${now.getDate()} ${months[now.getMonth()]} ${now.toLocaleTimeString()}`;
    document.getElementById("currentDate").innerText = formatted;
}

function calc() {
    clearInterval(timerInterval);

    const salary = Number(document.getElementById('salary').value);
    const payday = Number(document.getElementById('payday').value);

    if (!salary || !payday) {
        showNotification("⚠️ Lütfen maaş ve maaş gününü girin");
        return;
    }

    const startTime = document.getElementById("start").value;
    const endTime   = document.getElementById("end").value;

    // 📝 AYARLARI STORAGE'A KAYDET
    StorageService.updateItem('userSettings', {
        salary: salary,
        payday: payday,
        startTime: startTime,
        endTime: endTime
    });

    // 📊 ANALYTICS: Hesaplama yapıldığını kaydet
    ProletaryaAnalytics.track('calculation', {
        salary: salary,
        payday: payday,
        start_time: startTime,
        end_time: endTime,
        calculation_time: new Date().toISOString()
    });

    const now = new Date();
    const [sh, sm] = startTime.split(":").map(Number);
    const [eh, em] = endTime.split(":").map(Number);

    workStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sh, sm, 0);
    workEnd   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eh, em, 0);
    workDuration = (workEnd - workStart) / 1000;

    const year = now.getFullYear();
    const month = now.getMonth();

    let paydayDate = new Date(year, month, payday);
    if (paydayDate < now) paydayDate = new Date(year, month + 1, payday);

    const totalDaysRemaining = Math.ceil((paydayDate - now)/(1000*3600*24));

    const start = new Date(year, month, 1);
    const end = new Date(year, month+1, 0);

    totalWorkdaysThisMonth = 0;
    daysWorkedSoFar = 0;

    for (let d=1; d<=end.getDate(); d++){
        const date = new Date(year, month, d);
        const isWeekend = (date.getDay()===0 || date.getDay()===6);
        if (!isWeekend) {
            totalWorkdaysThisMonth++;
            if (date < now) daysWorkedSoFar++;
        }
    }

    dailyWage = salary / totalWorkdaysThisMonth;
    let monthlyEarnedBase = daysWorkedSoFar * dailyWage;

    let wdRemaining = 0;
    let tmp = new Date(now);
    while (tmp <= paydayDate){
        let g = tmp.getDay();
        if (g!==0 && g!==6) wdRemaining++;
        tmp.setDate(tmp.getDate()+1);
    }

    // 📊 ÇALIŞMA GEÇMİŞİNE EKLE
    StorageService.addWorkHistory({
        salary: salary,
        payday: payday,
        startTime: startTime,
        endTime: endTime,
        dailyWage: dailyWage,
        totalWorkdays: totalWorkdaysThisMonth,
        daysWorked: daysWorkedSoFar
    });

    // CANLI PANELİ OLUŞTUR (ÜSTE)
    document.getElementById("livePanel").innerHTML = `
    <div class="live-panel">
        <h2>⏱ Canlı Mesai Takibi</h2>
        <div class="bar-container"><div id="workBar" class="bar"><div class="bar-text" id="workBarText">0%</div></div></div>
        <p id="progressText"></p>
        <h3>💸 Anlık Kazanç</h3>
        <p>Bugün: <b id="earnedToday"></b></p>
        <p>Bu Ay: <b id="earnedMonth"></b></p>
        <h3>📊 Ücret Oranları</h3>
        <p>Saatlik: <b id="h"></b></p>
        <p>Dakikalık: <b id="m"></b></p>
        <p>Saniyelik: <b id="s"></b></p>
        <h3>📈 Aylık İlerleme</h3>
        <div class="bar-container"><div id="monthBar" class="bar"><div class="bar-text" id="monthBarText">0%</div></div></div>
    </div>
    `;

    // MOBİL TAKVİM DÜZENİ
    let calHtml = `<div class="calendar">`;
    for (let d=1; d<=end.getDate(); d++){
        const date = new Date(year, month, d);
        const isWeekend = (date.getDay()===0 || date.getDay()===6);

        let cls="";
        if (isWeekend) cls="holiday";
        else if (d === now.getDate()) cls="today";
        else if (date < now) cls="past";
        else cls="future";

        calHtml += `<div class="day ${cls}">`;
        calHtml += `<div>${d}</div>`;
        if (!isWeekend) {
            calHtml += `<small>${dailyWage.toFixed(0)}₺</small>`;
        }
        calHtml += `</div>`;
    }
    calHtml += `</div>`;

    document.getElementById("results").innerHTML = `
        <h3>📢 Genel Rapor</h3>
        <p>Maaşa kalan gün: <b>${totalDaysRemaining}</b></p>
        <p>Maaşa kalan iş günü: <b>${wdRemaining}</b></p>
        <p>Günlük hakediş: <b>${dailyWage.toFixed(2)}₺</b></p>
        <h3>📆 Proletarya Takvimi</h3>
        ${calHtml}
    `;

    // FORM ALANINI TAKVİM ALTINA TAŞI
    const formSection = document.getElementById('formSection');
    formSection.classList.add('collapsed');
    formSection.innerHTML = `
        <h3>⚙️ Ayarlar</h3>
        <label>Maaş:</label>
        <input id="salary" type="number" placeholder="15000" inputmode="numeric" value="${salary}"/>

        <label>Maaş Günü:</label>
        <input id="payday" type="number" placeholder="15" min="1" max="31" inputmode="numeric" value="${payday}"/>

        <label>Mesai Başlangıç:</label>
        <input id="start" type="time" value="${startTime}"/>

        <label>Mesai Bitiş:</label>
        <input id="end" type="time" value="${endTime}"/>

        <button onclick="calc()">🔄 Raporu Güncelle</button>
    `;

    // Bildirim durumunu sıfırla
    notificationState = {
        workStartShown: false,
        workEndShown: false,
        progress25: false,
        progress50: false,
        progress75: false,
        money100: false,
        money250: false,
        money500: false,
        hourlyShown: {},
        countdownShown: {}
    };

    showNotification("✅ Rapor oluşturuldu! Canlı takip başlatıldı.");
    startLiveCounter(monthlyEarnedBase);
}

function startLiveCounter(monthlyEarnedBase){
    const hourly = dailyWage / (workDuration/3600);
    const minutely = hourly / 60;
    const secondly = minutely / 60;

    document.getElementById("h").innerText = hourly.toFixed(2)+"₺";
    document.getElementById("m").innerText = minutely.toFixed(4)+"₺";
    document.getElementById("s").innerText = secondly.toFixed(6)+"₺";

    let lastEarnedToday = 0;
    let lastSaveTime = 0;

    timerInterval = setInterval(() => {
        const now = new Date();
        let earnedToday = 0;
        let progress = 0;

        if (now >= workStart && now <= workEnd) {
            const passed = (now - workStart)/1000;
            earnedToday = passed * secondly;
            progress = (passed / workDuration) * 100;
            
            // MESAJİ BAŞLANGIÇ BİLDİRİMİ
            if (!notificationState.workStartShown && passed < 60) {
                showNotification("🏁 Mesai başladı! Bugünkü kazanç: " + earnedToday.toFixed(2) + "₺");
                notificationState.workStartShown = true;
            }
            
            // MESAJİ İLERLEME BİLDİRİMLERİ
            if (progress >= 25 && !notificationState.progress25) {
                showNotification("🎉 Mesai %25 tamamlandı! " + (dailyWage*0.25).toFixed(2) + "₺ kazandın");
                notificationState.progress25 = true;
            }
            if (progress >= 50 && !notificationState.progress50) {
                showNotification("🚀 Yarı yola geldin! " + (dailyWage*0.5).toFixed(2) + "₺ kazandın");
                notificationState.progress50 = true;
            }
            if (progress >= 75 && !notificationState.progress75) {
                showNotification("💪 Son çeyrekte! " + (dailyWage*0.75).toFixed(2) + "₺ kazandın");
                notificationState.progress75 = true;
            }
            
            // KAZANÇ HEDEF BİLDİRİMLERİ
            if (earnedToday >= 100 && !notificationState.money100) {
                showNotification("💰 İlk 100₺'yi kazandın! 🎊");
                notificationState.money100 = true;
            }
            if (earnedToday >= 250 && !notificationState.money250) {
                showNotification("💵 250₺'ye ulaştın! ✨");
                notificationState.money250 = true;
            }
            if (earnedToday >= 500 && !notificationState.money500) {
                showNotification("💎 500₺ sınırını geçtin! 🚀");
                notificationState.money500 = true;
            }
            
            // SAATLİK BİLDİRİMLER
            const hoursPassed = Math.floor(passed / 3600);
            if (hoursPassed > 0 && !notificationState.hourlyShown[hoursPassed]) {
                showNotification("⏰ " + hoursPassed + " saat devam! " + (hourly * hoursPassed).toFixed(2) + "₺ kazandın");
                notificationState.hourlyShown[hoursPassed] = true;
            }
            
            // ZAMAN BİLDİRİMLERİ
            const minutesLeft = Math.floor((workDuration - passed) / 60);
            if (minutesLeft === 30 && !notificationState.countdownShown['30min']) {
                showNotification("🛑 Mesainin bitmesine 30 dakika kaldı");
                notificationState.countdownShown['30min'] = true;
            }
            if (minutesLeft === 10 && !notificationState.countdownShown['10min']) {
                showNotification("⏰ Mesainin bitmesine 10 dakika!");
                notificationState.countdownShown['10min'] = true;
            }
        }
        else if (now > workEnd) {
            earnedToday = dailyWage;
            progress = 100;
            
            // MESAJİ BİTİŞ BİLDİRİMİ
            if (!notificationState.workEndShown) {
                showNotification("🎯 Mesai tamamlandı! Bugün toplam: " + earnedToday.toFixed(2) + "₺ kazandın");
                notificationState.workEndShown = true;
            }
        }

        // ANLIK KAZANÇ GÜNCELLEMESİ
        if (Math.floor(earnedToday) !== Math.floor(lastEarnedToday) && Math.floor(earnedToday) % 50 === 0) {
            showNotification("📈 Şu anki kazanç: " + earnedToday.toFixed(2) + "₺");
        }
        lastEarnedToday = earnedToday;

        // 📝 HER 30 SANİYEDE BİR CANLI VERİYİ KAYDET
        const currentTime = Date.now();
        if (currentTime - lastSaveTime > 30000) {
            StorageService.addWorkHistory({
                type: 'live_snapshot',
                earnedToday: earnedToday,
                progress: progress,
                monthlyTotal: monthlyEarnedBase + earnedToday
            });
            lastSaveTime = currentTime;
        }

        document.getElementById("earnedToday").innerText = earnedToday.toFixed(2)+"₺";
        const monthlyTotal = monthlyEarnedBase + earnedToday;
        document.getElementById("earnedMonth").innerText = monthlyTotal.toFixed(2)+"₺";

        document.getElementById("workBar").style.width = progress.toFixed(2) + "%";
        document.getElementById("workBarText").innerText = progress.toFixed(1)+"%";

        const monthProgress = ((daysWorkedSoFar + (earnedToday/dailyWage)) / totalWorkdaysThisMonth) * 100;
        document.getElementById("monthBar").style.width = monthProgress.toFixed(2) + "%";
        document.getElementById("monthBarText").innerText = monthProgress.toFixed(1)+"%";

        if (now < workStart)
            document.getElementById("progressText").innerText = "Mesai henüz başlamadı.";
        else if (now > workEnd)
            document.getElementById("progressText").innerText = "Mesai tamamlandı.";
        else
            document.getElementById("progressText").innerText = "Günlük mesai: %" + progress.toFixed(2);

    }, 1000);
}

window.addEventListener('load', function() {
    // Analytics sistemini başlat
    ProletaryaAnalytics.init();
    
    // Storage'dan ayarları yükle
    const savedSettings = StorageService.getItem('userSettings');
    
    if (savedSettings) {
        document.getElementById('salary').value = savedSettings.salary || 15000;
        document.getElementById('payday').value = savedSettings.payday || 15;
        document.getElementById('start').value = savedSettings.startTime || '09:00';
        document.getElementById('end').value = savedSettings.endTime || '18:00';
        
        // OTOMATİK RAPOR OLUŞTUR
        setTimeout(() => {
            calc();
            showNotification("🔁 Önceki ayarlar yüklendi, gelişmiş analiz aktif!");
        }, 500);
        
    } else {
        document.getElementById('salary').value = 15000;
        document.getElementById('payday').value = 15;
    }

    // Geçmiş bildirimleri yükle
    const pastNotifications = StorageService.getItem('notifications') || [];
    if (pastNotifications.length > 0) {
        const lastNotification = pastNotifications[0];
        document.getElementById('notificationText').textContent = lastNotification.message;
    }

    if (window.navigator.standalone) {
        showNotification("📱 PWA modunda çalışıyorsunuz - Gelişmiş analiz aktif!");
    }

    // Pending event'leri retry et
    setTimeout(() => {
        ProletaryaAnalytics.retryPendingEvents();
    }, 2000);
});
